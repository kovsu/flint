name: Verify E2E compile cache fix

on:
  pull_request: ~

permissions: {}

jobs:
  e2e:
    name: ${{ matrix.os }} ${{ matrix.variant }} (attempt ${{ matrix.attempt }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        variant: [baseline, fix]
        attempt: [1, 2, 3, 4]
    steps:
      - uses: $/.github/actions/setup
      - name: Revert the fix for the baseline
        if: matrix.variant == 'baseline'
        shell: bash
        run: |
          node -e "const fs = require('node:fs'); const file = 'packages/e2e/tests/utils.ts'; fs.writeFileSync(file, fs.readFileSync(file, 'utf8').split('\n').filter((line) => !line.includes('NODE_DISABLE_COMPILE_CACHE')).join('\n'));"
          echo "NODE_DISABLE_COMPILE_CACHE lines left: $(grep -c NODE_DISABLE_COMPILE_CACHE packages/e2e/tests/utils.ts || true)"
      - name: Run e2e Tests
        shell: bash
        run: pnpm run test --project e2e --run --testTimeout=180000
